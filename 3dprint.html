<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamówienia 3D | OSH QRD Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff8c00;
            --bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --text: #ffffff;
            --input-bg: #222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.6; padding-top: 80px; }

        /* Menu górne */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 10%; background: rgba(15, 15, 15, 0.98);
            position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid #333;
        }
        .logo-text { font-size: 1.1rem; font-weight: bold; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
        .nav-controls { display: flex; align-items: center; gap: 15px; }
        .lang-switch {
            background: transparent; border: 1px solid var(--primary); color: var(--primary);
            padding: 4px 10px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 0.75rem;
        }

        /* Kontener główny - domyślnie ukryty */
        #mainContent { display: none; }
        .container { width: 100%; max-width: 600px; margin: 0 auto; padding: 10px; }

        /* Karty i Formularze */
        .card {
            background: var(--card-bg); padding: 20px; border-radius: 12px;
            border: 1px solid #333; margin-bottom: 20px;
        }
        input {
            width: 100%; padding: 12px; margin-bottom: 15px; background: var(--input-bg);
            border: 1px solid #444; color: white; border-radius: 8px; font-size: 14px;
        }
        .btn-action {
            width: 100%; background: var(--primary); color: black;
            border: none; padding: 14px; border-radius: 8px;
            font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 10px;
        }

        /* MODAL LOGOWANIA I REJESTRACJI */
        #authOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 3000;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .auth-card { max-width: 380px; width: 100%; text-align: center; }
        .google-btn { background: white; color: #444; }
        .auth-footer { display: flex; justify-content: space-between; font-size: 0.75rem; margin-top: 15px; }

        /* Style kalkulatora i listy */
        #adminPanel { display: none; }
        .group-box { background: rgba(255, 140, 0, 0.03); padding: 15px; border-radius: 10px; border: 1px solid #333; margin-bottom: 15px; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-end; }
        .row div { flex: 1; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 11px; color: var(--primary); text-transform: uppercase; }
        .result-zone { background: var(--primary); color: #000; padding: 15px; border-radius: 10px; text-align: center; }
        .total-val { font-size: 32px; font-weight: 900; }
        
        /* Lista */
        .client-group { background: #222; margin-bottom: 10px; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
        .client-header { background: #2a2a2a; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .client-content { display: none; padding: 10px; background: #1a1a1a; }
        .client-content.active { display: block; }
        .status-badge { padding: 2px 5px; border-radius: 3px; font-size: 10px; font-weight: bold; color: white; }
        .unpaid { background: #ff4444; } .paid { background: #00c851; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        td, th { padding: 8px; text-align: left; border-bottom: 1px solid #333; }

        #profileModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; justify-content:center; align-items:center; }
    </style>
</head>
<body>

    <div id="authOverlay">
        <div class="card auth-card">
            <h3 id="authTitle" style="margin-bottom: 20px;">Zaloguj się</h3>
            <div id="authForm">
                <input type="email" id="authEmail" placeholder="Email">
                <input type="password" id="authPassword" placeholder="Hasło">
                
                <button class="btn-action" onclick="handleAuth()" id="authMainBtn">Zaloguj się</button>
                
                <button class="btn-action google-btn" onclick="handleGoogleLogin()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" style="vertical-align: middle; margin-right: 8px;"> Google
                </button>

                <div class="auth-footer">
                    <p id="toggleAuthMode" style="color:var(--text-muted); cursor:pointer;" onclick="toggleAuthMode()">Załóż konto</p>
                    <p style="color:var(--primary); cursor:pointer;" onclick="handleResetPassword()">Reset hasła</p>
                </div>
            </div>
        </div>
    </div>

    <nav>
        <div class="logo-text" onclick="window.location.href='index.html'">OSH QRD Studio</div>
        <div class="nav-controls">
            <button id="userBtn" class="lang-switch" onclick="toggleProfileModal()"><i class="fas fa-user"></i></button>
        </div>
    </nav>

    <div id="profileModal">
        <div class="card" style="max-width:350px; width: 90%;">
            <i class="fas fa-times" onclick="toggleProfileModal()" style="float:right; cursor:pointer; color:var(--primary);"></i>
            <h3 style="margin-top:20px;">Twój Profil</h3>
            <p id="userEmailDisplay" style="text-align:center; margin: 20px 0; font-size:0.9rem;"></p>
            <button class="btn-action" onclick="handleLogout()">Wyloguj się</button>
        </div>
    </div>

    <div id="mainContent">
        <div class="container">
            <div id="adminPanel">
                <div class="card">
                    <h2>Kalkulator Admina</h2>
                    <div class="group-box" style="border-color: var(--primary); border-style: dashed;">
                        <label>Czas pracy:</label>
                        <div class="row">
                            <div><label>Dziesiętnie</label><input type="number" id="decHours" step="0.01" oninput="syncFromDecimal()"></div>
                            <div><label>h</label><input type="number" id="hPart" oninput="syncFromHM()"></div>
                            <div><label>min</label><input type="number" id="mPart" oninput="syncFromHM()"></div>
                        </div>
                    </div>
                    <div class="group-box">
                        <div class="row">
                            <div><label>Waga (g):</label><input type="number" id="weight" oninput="calculate()"></div>
                            <div><label>Filament (zł/kg):</label><input type="number" id="pricePerKg" value="60" oninput="calculate()"></div>
                        </div>
                    </div>
                    <div class="group-box">
                        <div class="row">
                            <div><label>Amortyzacja (zł/h):</label><input type="number" id="amortRate" value="3.00" oninput="calculate()"></div>
                            <div><label>Moc (W):</label><input type="number" id="powerW" value="50" oninput="calculate()"></div>
                        </div>
                        <div class="row">
                            <div><label>Prąd (zł/kWh):</label><input type="number" id="energyPrice" value="0.90" oninput="calculate()"></div>
                            <div><label>Robocizna (zł):</label><input type="number" id="labor" value="0" oninput="calculate()"></div>
                        </div>
                    </div>
                    <div class="group-box" style="border-color: #555;">
                        <label>Dane Klienta:</label>
                        <input type="text" id="clientName" placeholder="Imię i Nazwisko" style="margin-bottom:10px;">
                        <input type="email" id="clientEmail" placeholder="E-mail klienta">
                        <input type="text" id="printTitle" placeholder="Tytuł wydruku" style="margin-top:10px;">
                    </div>
                    <div class="result-zone">
                        <div class="total-val"><span id="totalPrice">0.00</span> zł</div>
                        <div id="details" style="font-size: 9px; margin-top: 5px;"></div>
                    </div>
                    <button class="btn-action" onclick="saveToFirebase()">Zapisz zamówienie</button>
                </div>
            </div>

            <div id="ordersContainer">
                <h3 id="listTitle" style="margin-bottom: 20px;">Twoje Wydruki</h3>
                <div id="clientsList"></div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAnEOlk-g8nFBbBKU7hp7aEbIq8u2NBGxI",
        authDomain: "oqstudiopage.firebaseapp.com",
        projectId: "oqstudiopage",
        storageBucket: "oqstudiopage.firebasestorage.app",
        messagingSenderId: "1036616830810",
        appId: "1:1036616830810:web:6a7cfcde0e6a80454d2d63"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let isLoginMode = true;
    let openClients = new Set();
    const ADMIN_EMAIL = "pioosz2@gmail.com";

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('userEmailDisplay').innerText = user.email;

            if (user.email === ADMIN_EMAIL) {
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('listTitle').innerText = "Wszystkie Zamówienia (Admin)";
                loadOrders(true, user.email);
            } else {
                loadOrders(false, user.email);
            }
        } else {
            document.getElementById('authOverlay').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'none';
        }
    });

    // LOGIKA AUTORYZACJI
    window.toggleAuthMode = () => {
        isLoginMode = !isLoginMode;
        document.getElementById('authTitle').innerText = isLoginMode ? "Zaloguj się" : "Załóż konto";
        document.getElementById('authMainBtn').innerText = isLoginMode ? "Zaloguj się" : "Zarejestruj się";
        document.getElementById('toggleAuthMode').innerText = isLoginMode ? "Załóż konto" : "Mam już konto";
    };

    window.handleAuth = () => {
        const email = document.getElementById('authEmail').value;
        const pass = document.getElementById('authPassword').value;
        if(!email || !pass) return alert("Uzupełnij pola!");

        if (isLoginMode) {
            signInWithEmailAndPassword(auth, email, pass).catch(err => alert(err.message));
        } else {
            createUserWithEmailAndPassword(auth, email, pass).then(() => {
                alert("Konto stworzone pomyślnie!");
                toggleAuthMode();
            }).catch(err => alert(err.message));
        }
    };

    window.handleGoogleLogin = () => {
        signInWithPopup(auth, provider).catch(err => alert(err.message));
    };

    window.handleResetPassword = () => {
        const email = document.getElementById('authEmail').value;
        if(!email) return alert("Wpisz email!");
        sendPasswordResetEmail(auth, email).then(() => alert("Link wysłany!")).catch(err => alert(err.message));
    };

    window.handleLogout = () => signOut(auth).then(() => location.reload());
    window.toggleProfileModal = () => {
        const m = document.getElementById('profileModal');
        m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    };

    // POBIERANIE DANYCH
    function loadOrders(isAdmin, userEmail) {
        const emailFilter = userEmail.toLowerCase();
        let q = isAdmin ? 
            query(collection(db, "orders"), orderBy("createdAt", "desc")) : 
            query(collection(db, "orders"), where("clientEmail", "==", emailFilter), orderBy("createdAt", "desc"));

        onSnapshot(q, (snapshot) => {
            const list = document.getElementById('clientsList');
            list.innerHTML = "";
            const groups = {};

            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                const groupKey = isAdmin ? data.clientName : "Twoje Zamówienia";
                if(!groups[groupKey]) groups[groupKey] = { orders: [], unpaidTotal: 0, email: data.clientEmail };
                groups[groupKey].orders.push({ id: docSnap.id, ...data });
                if(!data.paid) groups[groupKey].unpaidTotal += data.price;
            });

            for (const [name, info] of Object.entries(groups)) {
                const isOpen = isAdmin ? openClients.has(name) : true;
                const clientDiv = document.createElement('div');
                clientDiv.className = 'client-group';
                clientDiv.innerHTML = `
                    <div class="client-header" onclick="toggleClientView('${name}')">
                        <div>
                            <h4><i class="fas fa-user"></i> ${name}</h4>
                            ${isAdmin ? `<small style="color:#888;">${info.email}</small>` : ''}
                        </div>
                        <span style="font-weight:bold;">${info.unpaidTotal.toFixed(2)} zł</span>
                    </div>
                    <div class="client-content ${isOpen ? 'active' : ''}">
                        <table>
                            <thead><tr><th>Projekt</th><th>Cena</th><th>Status</th>${isAdmin ? '<th>Akcja</th>' : ''}</tr></thead>
                            <tbody>
                                ${info.orders.map(o => `
                                    <tr>
                                        <td>${o.printTitle}</td>
                                        <td>${o.price.toFixed(2)} zł</td>
                                        <td><span class="status-badge ${o.paid ? 'paid' : 'unpaid'}">${o.paid ? 'ZAPŁACONE' : 'NIEZAPŁACONE'}</span></td>
                                        ${isAdmin ? `<td style="white-space:nowrap;">
                                            <button onclick="togglePaid('${o.id}', ${o.paid})" style="background:none; border:none; color:var(--primary); cursor:pointer;"><i class="fas fa-check"></i></button>
                                            <button onclick="deleteOrder('${o.id}')" style="background:none; border:none; color:#ff4444; cursor:pointer; margin-left:8px;"><i class="fas fa-trash"></i></button>
                                        </td>` : ''}
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                list.appendChild(clientDiv);
            }
        });
    }

    // KALKULATOR LOGIKA
    window.syncFromDecimal = () => {
        const dec = parseFloat(document.getElementById('decHours').value) || 0;
        document.getElementById('hPart').value = Math.floor(dec) || '';
        document.getElementById('mPart').value = Math.round((dec % 1) * 60) || '';
        calculate();
    };
    window.syncFromHM = () => {
        const h = parseInt(document.getElementById('hPart').value) || 0;
        const m = parseInt(document.getElementById('mPart').value) || 0;
        document.getElementById('decHours').value = (h + m/60).toFixed(2);
        calculate();
    };
    window.calculate = () => {
        const hours = parseFloat(document.getElementById('decHours').value) || 0;
        const weight = parseFloat(document.getElementById('weight').value) || 0;
        const priceKg = parseFloat(document.getElementById('pricePerKg').value) || 0;
        const amort = parseFloat(document.getElementById('amortRate').value) || 0;
        const power = parseFloat(document.getElementById('powerW').value) || 0;
        const energy = parseFloat(document.getElementById('energyPrice').value) || 0;
        const labor = parseFloat(document.getElementById('labor').value) || 0;
        const mat = (priceKg / 1000) * weight;
        const elec = (hours * (power / 1000)) * energy;
        const amCost = hours * amort;
        const total = mat + elec + amCost + labor;
        document.getElementById('totalPrice').innerText = total.toFixed(2);
        document.getElementById('details').innerText = `MAT: ${mat.toFixed(2)}zł | PRĄD: ${elec.toFixed(2)}zł | AMORT: ${amCost.toFixed(2)}zł`;
        return total;
    };
    window.saveToFirebase = async () => {
        const client = document.getElementById('clientName').value.trim();
        const email = document.getElementById('clientEmail').value.trim().toLowerCase();
        const title = document.getElementById('printTitle').value.trim();
        const price = calculate();
        if(!client || !email || !title) return alert("Uzupełnij wszystko!");
        openClients.add(client);
        await addDoc(collection(db, "orders"), {
            clientName: client, clientEmail: email, printTitle: title, price: parseFloat(price), paid: false, createdAt: Date.now()
        });
        document.getElementById('printTitle').value = "";
    };
    window.toggleClientView = (name) => {
        if (openClients.has(name)) openClients.delete(name); else openClients.add(name);
        document.querySelectorAll('.client-group').forEach(g => {
            if(g.querySelector('h4').innerText.includes(name)) g.querySelector('.client-content').classList.toggle('active');
        });
    };
    window.togglePaid = async (id, status) => { await updateDoc(doc(db, "orders", id), { paid: !status }); };
    window.deleteOrder = async (id) => { if(confirm("Usunąć?")) await deleteDoc(doc(db, "orders", id)); };
</script>
</body>
</html>
