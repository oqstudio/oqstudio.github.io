<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Druku 3D | OSH QRD Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff8c00;
            --bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --text: #ffffff;
            --input-bg: #222;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex; flex-direction: column; align-items: center;
            padding: 10px; margin: 0;
        }

        .container { width: 100%; max-width: 600px; }

        .card {
            background: var(--card-bg); padding: 20px; border-radius: 15px;
            border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        h2, h3 { color: var(--primary); text-align: center; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }

        .group-box {
            background: rgba(255, 140, 0, 0.03); padding: 15px;
            border-radius: 10px; border: 1px solid #333; margin-bottom: 15px;
        }

        .row { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-end; }
        .row div { flex: 1; min-width: 0; }

        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 11px; color: var(--primary); text-transform: uppercase; }
        
        input {
            width: 100%; padding: 12px; background: var(--input-bg);
            border: 1px solid #444; color: white; border-radius: 8px;
            font-size: 15px; box-sizing: border-box;
        }

        input:focus { border-color: var(--primary); outline: none; background: #2a2a2a; }

        .result-zone {
            background: var(--primary); color: #000; padding: 15px;
            border-radius: 10px; text-align: center; margin-top: 15px;
        }

        .total-val { font-size: 32px; font-weight: 900; }
        
        .btn-action {
            width: 100%; background: var(--primary); color: black;
            border: none; padding: 15px; border-radius: 8px;
            font-weight: bold; font-size: 16px; cursor: pointer;
            margin-top: 10px; text-transform: uppercase;
        }

        /* Sekcja Klientów */
        .client-group { background: #222; margin-bottom: 10px; border-radius: 8px; overflow: hidden; border: 1px solid #333; }

        .client-header {
            background: #2a2a2a; padding: 12px 15px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: 0.3s;
        }

        .client-header:hover { background: #333; }
        .client-header h4 { margin: 0; color: var(--primary); font-size: 14px; }

        .client-content { display: none; padding: 10px; background: #1a1a1a; }
        .client-content.active { display: block; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        td, th { padding: 8px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #888; font-size: 11px; }

        .status-badge { padding: 2px 5px; border-radius: 3px; font-size: 10px; font-weight: bold; }
        .unpaid { background: #ff4444; color: white; }
        .paid { background: #00c851; color: white; }

        .back-link { align-self: flex-start; color: var(--primary); text-decoration: none; margin-bottom: 10px; font-size: 13px; }
        small { color: #888; display: block; margin-top: 2px; font-size: 9px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Powrót do strony głównej</a>

    <div class="card">
        <h2>Wycena Wydruku</h2>
        
        <div class="group-box" style="border-color: var(--primary); border-style: dashed;">
            <label><i class="fas fa-clock"></i> Czas pracy (Sync):</label>
            <div class="row">
                <div>
                    <label style="color: #888; font-size: 9px;">Format Bambu</label>
                    <input type="number" id="decHours" step="0.01" placeholder="0.00" oninput="syncFromDecimal()">
                </div>
                <div>
                    <label style="color: #888; font-size: 9px;">Godziny</label>
                    <input type="number" id="hPart" placeholder="h" oninput="syncFromHM()">
                </div>
                <div>
                    <label style="color: #888; font-size: 9px;">Minuty</label>
                    <input type="number" id="mPart" placeholder="min" oninput="syncFromHM()">
                </div>
            </div>
        </div>

        <div class="group-box">
            <div class="row">
                <div>
                    <label>Waga (g):</label>
                    <input type="number" id="weight" placeholder="0" oninput="calculate()">
                </div>
                <div>
                    <label>Filament (zł/kg):</label>
                    <input type="number" id="pricePerKg" value="60" oninput="calculate()">
                </div>
            </div>
        </div>

        <div class="group-box">
            <div class="row">
                <div>
                    <label>Amortyzacja (zł/h):</label>
                    <input type="number" id="amortRate" value="3.00" oninput="calculate()">
                    <small>Z Twojego oryginału</small>
                </div>
                <div>
                    <label>Moc (W):</label>
                    <input type="number" id="powerW" value="50" oninput="calculate()">
                    <small>Bambu A1 Mini</small>
                </div>
            </div>
            <div class="row" style="margin-top: 10px;">
                <div>
                    <label>Cena prądu (zł/kWh):</label>
                    <input type="number" id="energyPrice" value="0.90" oninput="calculate()">
                </div>
                <div>
                    <label>Robocizna / Inne (zł):</label>
                    <input type="number" id="labor" value="0" oninput="calculate()">
                </div>
            </div>
        </div>

        <div class="group-box" style="border-color: #555;">
            <div class="row">
                <div>
                    <label>Klient:</label>
                    <input type="text" id="clientName" placeholder="Np. Jan Kowalski">
                </div>
                <div>
                    <label>Tytuł wydruku:</label>
                    <input type="text" id="printTitle" placeholder="Np. Figurka Smoka">
                </div>
            </div>
        </div>

        <div class="result-zone">
            <div style="font-weight: bold; text-transform: uppercase; font-size: 11px;">Łączny koszt dla klienta</div>
            <div class="total-val"><span id="totalPrice">0.00</span> zł</div>
            <div id="details" style="font-size: 9px; margin-top: 5px; opacity: 0.8;"></div>
        </div>

        <button class="btn-action" onclick="saveToFirebase()"><i class="fas fa-save"></i> Zapisz zamówienie</button>
    </div>

    <div id="ordersContainer" class="container" style="padding:0;">
        <h3 style="margin-bottom: 10px;">Baza Zamówień (Klienci)</h3>
        <div id="clientsList"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAnEOlk-g8nFBbBKU7hp7aEbIq8u2NBGxI",
        authDomain: "oqstudiopage.firebaseapp.com",
        projectId: "oqstudiopage",
        storageBucket: "oqstudiopage.firebasestorage.app",
        messagingSenderId: "1036616830810",
        appId: "1:1036616830810:web:6a7cfcde0e6a80454d2d63"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Zapamiętywanie otwartych okienek (używamy zestawu nazw klientów)
    let openClients = new Set();

    onAuthStateChanged(auth, (user) => {
        if (!user || user.email !== "pioosz2@gmail.com") window.location.href = "index.html";
    });

    window.syncFromDecimal = () => {
        const dec = parseFloat(document.getElementById('decHours').value) || 0;
        const h = Math.floor(dec);
        const m = Math.round((dec - h) * 60);
        document.getElementById('hPart').value = h || '';
        document.getElementById('mPart').value = m || '';
        calculate();
    };

    window.syncFromHM = () => {
        const h = parseInt(document.getElementById('hPart').value) || 0;
        const m = parseInt(document.getElementById('mPart').value) || 0;
        const dec = h + (m / 60);
        document.getElementById('decHours').value = dec > 0 ? dec.toFixed(2) : '';
        calculate();
    };

    window.calculate = () => {
        const decHours = parseFloat(document.getElementById('decHours').value) || 0;
        const weight = parseFloat(document.getElementById('weight').value) || 0;
        const pricePerKg = parseFloat(document.getElementById('pricePerKg').value) || 0;
        const amortRate = parseFloat(document.getElementById('amortRate').value) || 0;
        const labor = parseFloat(document.getElementById('labor').value) || 0;
        const power = parseFloat(document.getElementById('powerW').value) || 0;
        const energyPrice = parseFloat(document.getElementById('energyPrice').value) || 0;

        const costMaterial = (pricePerKg / 1000) * weight;
        const costEnergy = (decHours * (power / 1000)) * energyPrice;
        const costAmort = decHours * amortRate;
        const total = costMaterial + costEnergy + costAmort + labor;

        document.getElementById('totalPrice').innerText = total.toFixed(2);
        document.getElementById('details').innerText = `MAT: ${costMaterial.toFixed(2)}zł | PRĄD: ${costEnergy.toFixed(2)}zł | AMORT: ${costAmort.toFixed(2)}zł | ROB: ${labor.toFixed(2)}zł`;
        return total;
    };

    window.saveToFirebase = async () => {
        const client = document.getElementById('clientName').value.trim();
        const title = document.getElementById('printTitle').value.trim();
        const price = calculate();
        if(!client || !title) return alert("Podaj klienta i tytuł!");

        // Automatycznie otwórz okienko dla tego klienta po zapisie
        openClients.add(client);

        await addDoc(collection(db, "orders"), {
            clientName: client,
            printTitle: title,
            price: parseFloat(price),
            paid: false,
            createdAt: Date.now()
        });
        document.getElementById('printTitle').value = "";
    };

    const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
        const clientsList = document.getElementById('clientsList');
        clientsList.innerHTML = "";
        
        const groups = {};
        snapshot.forEach(docSnap => {
            const data = docSnap.data();
            const id = docSnap.id;
            if(!groups[data.clientName]) groups[data.clientName] = { orders: [], unpaidTotal: 0 };
            groups[data.clientName].orders.push({ id, ...data });
            if(!data.paid) groups[data.clientName].unpaidTotal += data.price;
        });

        for (const [name, info] of Object.entries(groups)) {
            const isOpen = openClients.has(name);
            const clientDiv = document.createElement('div');
            clientDiv.className = 'client-group';
            clientDiv.innerHTML = `
                <div class="client-header" onclick="toggleClientView('${name}')">
                    <h4><i class="fas fa-user"></i> ${name}</h4>
                    <span style="font-weight:bold; font-size:13px;">${info.unpaidTotal.toFixed(2)} zł <i class="fas ${isOpen ? 'fa-chevron-up' : 'fa-chevron-down'}" style="margin-left:10px; font-size:10px;"></i></span>
                </div>
                <div class="client-content ${isOpen ? 'active' : ''}">
                    <table>
                        <thead><tr><th>Tytuł</th><th>Cena</th><th>Status</th><th></th></tr></thead>
                        <tbody>
                            ${info.orders.map(o => `
                                <tr>
                                    <td>${o.printTitle}</td>
                                    <td>${o.price.toFixed(2)} zł</td>
                                    <td><span class="status-badge ${o.paid ? 'paid' : 'unpaid'}">${o.paid ? 'TAK' : 'NIE'}</span></td>
                                    <td style="text-align:right;">
                                        <button onclick="togglePaid('${o.id}', ${o.paid})" style="background:none; border:none; color:var(--primary); cursor:pointer;"><i class="fas fa-check"></i></button>
                                        <button onclick="deleteOrder('${o.id}')" style="background:none; border:none; color:#ff4444; cursor:pointer; margin-left:8px;"><i class="fas fa-trash"></i></button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            clientsList.appendChild(clientDiv);
        }
    });

    window.toggleClientView = (name) => {
        if (openClients.has(name)) {
            openClients.delete(name);
        } else {
            openClients.add(name);
        }
        // Wywołujemy calculate tylko po to by wymusić re-render (onSnapshot zrobi to sam przy zmianie danych, ale tu zmieniamy tylko lokalny stan widoku)
        // Najprościej wywołać calculate lub bezpośrednio odświeżyć widok, ale onSnapshot nie zareaguje na zmianę Set.
        // Dlatego dodajemy ręczne przełączanie klasy dla szybkości:
        const headers = document.querySelectorAll('.client-header');
        headers.forEach(h => {
            if(h.innerText.includes(name)) {
                h.nextElementSibling.classList.toggle('active');
                const icon = h.querySelector('.fas.fa-chevron-down, .fas.fa-chevron-up');
                icon.classList.toggle('fa-chevron-down');
                icon.classList.toggle('fa-chevron-up');
            }
        });
    };

    window.togglePaid = async (id, status) => {
        // Nie czyścimy openClients, więc stan zostanie zachowany
        await updateDoc(doc(db, "orders", id), { paid: !status });
    };

    window.deleteOrder = async (id) => {
        if(confirm("Usunąć to zamówienie?")) await deleteDoc(doc(db, "orders", id));
    };
</script>
</body>
</html>
