<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSH QRD Studio | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff8c00;
            --bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --text: #ffffff;
            --text-muted: #b0b0b0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.6; scroll-behavior: smooth; }

        /* Nav */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 10%; background: rgba(15, 15, 15, 0.98);
            position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid #333;
        }
        .logo-text { font-size: 1.1rem; font-weight: bold; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; flex: 1; }
        .nav-controls { display: flex; align-items: center; gap: 15px; }
        .nav-links { display: flex; list-style: none; align-items: center; }
        .nav-links li { margin-left: 25px; }
        .nav-links li a { color: var(--text); text-decoration: none; transition: 0.3s; font-size: 0.9rem; font-weight: 500; }
        .nav-links li a:hover { color: var(--primary); }
        .lang-switch { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 4px 10px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }

        /* Modal */
        #authModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); z-index:2000; justify-content:center; align-items:center; padding: 20px; }
        #authModal .card { position: relative; max-width: 350px; background: #1a1a1a; padding: 30px; border-radius: 12px; border: 1px solid #333; width: 100%; }
        #authModal input { width: 100%; padding: 12px; margin-bottom: 15px; background: #222; border: 1px solid #444; color: white; border-radius: 5px; }
        
        .btn { width: 100%; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; margin-bottom: 10px; }
        .btn-primary { background: var(--primary); color: black; }
        .btn-google { background: white; color: #444; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .auth-footer { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); }
        .auth-footer span { cursor: pointer; color: var(--primary); }

        /* Hero */
        .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?auto=format&fit=crop&w=1350&q=80'); background-size: cover; }
        .hero img { max-width: 220px; margin-bottom: 25px; }
        .highlight { color: var(--primary); }
    </style>
</head>
<body>

    <nav>
        <div class="logo-text">OSH QRD Studio</div>
        <div class="nav-controls">
            <button class="lang-switch" onclick="toggleLang()">PL / EN</button>
            <button id="userBtn" class="lang-switch" onclick="toggleAuthModal()"><i class="fas fa-user"></i></button>
        </div>
        <ul class="nav-links" id="navLinks">
            <li><a href="#home" class="lang" data-en="Start" data-pl="Start">Start</a></li>
            <li><a href="#contact" class="lang" data-en="Contact" data-pl="Kontakt">Contact</a></li>
        </ul>
    </nav>

    <div id="authModal">
        <div class="card">
            <i class="fas fa-times" onclick="toggleAuthModal()" style="position:absolute; top:15px; right:15px; cursor:pointer; color: var(--primary);"></i>
            <h3 id="modalTitle" style="margin-bottom:20px; text-align: center;">Logowanie</h3>
            
            <div id="authForm">
                <input type="email" id="authEmail" placeholder="Email">
                <input type="password" id="authPassword" placeholder="Hasło">
                <button class="btn btn-primary" onclick="handleAuth()" id="mainAuthBtn">Zaloguj się</button>
                
                <button class="btn btn-google" onclick="handleGoogleLogin()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Google
                </button>

                <div class="auth-footer">
                    <p id="toggleText">Nie masz konta? <span onclick="toggleAuthMode()">Zarejestruj</span></p>
                    <span onclick="handleResetPassword()">Reset hasła</span>
                </div>
            </div>
            
            <div id="userInfo" style="display:none; text-align: center;">
                <p id="userDisplay" style="margin-bottom:20px; font-weight: bold;"></p>
                <button class="btn btn-primary" style="background: transparent; border: 1px solid var(--primary); color: var(--primary);" onclick="handleLogout()">Wyloguj się</button>
            </div>
        </div>
    </div>

    <section class="hero" id="home">
        <img src="logo.png" alt="Logo">
        <h1>CYFROWE ŚWIATY <span class="highlight">W TWOIM ZASIĘGU</span></h1>
        <p>Game Developer | 3D Artist | 3D Printing</p>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, 
            sendPasswordResetEmail, signInWithPopup, GoogleAuthProvider, 
            onAuthStateChanged, signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnEOlk-g8nFBbBKU7hp7aEbIq8u2NBGxI",
            authDomain: "oqstudiopage.firebaseapp.com",
            projectId: "oqstudiopage",
            storageBucket: "oqstudiopage.firebasestorage.app",
            messagingSenderId: "1036616830810",
            appId: "1:1036616830810:web:6a7cfcde0e6a80454d2d63",
            measurementId: "G-KC5B8K4HPJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let isLoginMode = true;

        window.toggleAuthModal = () => {
            const modal = document.getElementById('authModal');
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        };

        window.toggleAuthMode = () => {
            isLoginMode = !isLoginMode;
            document.getElementById('modalTitle').innerText = isLoginMode ? "Logowanie" : "Rejestracja";
            document.getElementById('mainAuthBtn').innerText = isLoginMode ? "Zaloguj się" : "Zarejestruj się";
            document.getElementById('toggleText').innerHTML = isLoginMode ? 'Nie masz konta? <span onclick="toggleAuthMode()">Zarejestruj</span>' : 'Masz konto? <span onclick="toggleAuthMode()">Zaloguj</span>';
        };

        window.handleAuth = () => {
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPassword').value;
            if(!email || !pass) return alert("Wpisz dane");

            if(isLoginMode) {
                signInWithEmailAndPassword(auth, email, pass).then(() => toggleAuthModal()).catch(err => alert(err.message));
            } else {
                createUserWithEmailAndPassword(auth, email, pass).then(() => { alert("Konto stworzone!"); toggleAuthMode(); }).catch(err => alert(err.message));
            }
        };

        window.handleGoogleLogin = () => {
            signInWithPopup(auth, provider).then(() => toggleAuthModal()).catch(err => alert(err.message));
        };

        window.handleResetPassword = () => {
            const email = document.getElementById('authEmail').value;
            if(!email) return alert("Wpisz email");
            sendPasswordResetEmail(auth, email).then(() => alert("Email wysłany!")).catch(err => alert(err.message));
        };

        window.handleLogout = () => { signOut(auth).then(() => location.reload()); };

        onAuthStateChanged(auth, (user) => {
            const form = document.getElementById('authForm');
            const info = document.getElementById('userInfo');
            const navLinks = document.getElementById('navLinks');
            const userBtn = document.getElementById('userBtn');

            if (user) {
                form.style.display = 'none';
                info.style.display = 'block';
                document.getElementById('userDisplay').innerText = user.email;
                userBtn.style.color = '#ff8c00';

                if (!document.getElementById('serviceLink')) {
                    const li = document.createElement('li');
                    li.id = 'serviceLink';
                    li.innerHTML = '<a href="3dprint.html" style="color: #ff8c00; font-weight: bold;">DRUK 3D</a>';
                    navLinks.appendChild(li);
                }
            } else {
                form.style.display = 'block';
                info.style.display = 'none';
                userBtn.style.color = 'white';
                const link = document.getElementById('serviceLink');
                if (link) link.remove();
            }
        });
    </script>
</body>
</html>
